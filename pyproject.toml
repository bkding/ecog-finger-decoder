[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ecog-finger-decoder"
version = "0.1"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "mne==1.13.2",
    "torch==2.15.0",
    "pytorch-lightning==2.6.6",
]

[tool.setuptools]
packages = ["ecog_finger_decoder"]
